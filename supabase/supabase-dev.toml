# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "common"

[api]
enabled = true
port = 54321

[db]
# Test database port (different from dev port 54322)
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = [ './seed.sql' ]

[db.pooler]
enabled = true
port = 6543
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
# Test Studio port (different from dev port 54323)
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
# Test Inbucket port (different from dev port 54324)
port = 54324
# Explicit SMTP port so app-sent mail can target it via EMAIL_SMTP_URL
smtp_port = 54325

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.assets]
public = true

[storage.buckets.avatars]
public = true
objects_path = "./storage/avatars"

# Private. A reader needs a signed URL. See EXPORTS_BUCKET in @op/common.
[storage.buckets.exports]
public = false

[auth]
enabled = true
# Pin JWT secret so the well-known local dev keys in .env.docker remain valid across restarts.
jwt_secret = "super-secret-jwt-token-with-at-least-32-characters-long"
site_url = "http://localhost:3100/"
additional_redirect_urls = [ "https://127.0.0.1:3000" ]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Require email confirmation so changing an anonymous user's email (the
# anon→account upgrade) sends a verification code instead of applying silently.
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your email"
content_path = "./supabase/templates/confirm.html"

[auth.email.template.magic_link]
subject = "Your login code"
content_path = "./supabase/templates/magiclink.html"

# Email-change confirmation carries {{ .Token }} so verifyOtp({type:'email_change'})
# can confirm the code entered on the "Create profile" screen.
[auth.email.template.email_change]
subject = "Confirm your email"
content_path = "./supabase/templates/email_change.html"

[auth.sms]
enable_signup = true
enable_confirmations = false
template = "Your code is {{ .Code }} ."
max_frequency = "5s"

# GoTrue delegates the whole code lifecycle to Twilio Verify: Twilio generates
# the code, sends it, and checks it. Verify is exempt from A2P 10DLC, so this
# works before a campaign is approved, unlike plain `twilio`, which sends over
# Programmable Messaging and fails with error 30034 until then.
#
# `message_service_sid` holds the VA... Verify service in this mode. The name
# comes from the shared provider shape, not from a Messaging Service.
#
# Verify owns the copy and the expiry here, so `template` and `sms_otp_exp`
# above do not reach the participant.
#
# `enable_confirmations = false` above is GoTrue's SMS autoconfirm. It affects
# only what GoTrue records on `auth.users`, and network membership does not
# read that column — it reads `phone_verifications`, which only our own
# procedures write after Twilio approves a number.
[auth.sms.twilio_verify]
enabled = true
account_sid = "env(TWILIO_ACCOUNT_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"
message_service_sid = "env(TWILIO_VERIFY_SERVICE_SID)"

# A listed number skips the provider entirely, so local work costs no text and
# needs no Twilio account. GoTrue still creates the account, confirms the
# phone, and issues a session, so the whole sign-in path is exercised — only
# the delivery is bypassed.
#
# Sign in as +1 500 555 0006 with the code 123456. The range is reserved by
# Twilio for testing, so no real line can collide with it.
[auth.sms.test_otp]
15005550006 = "123456"

# Caps how many codes GoTrue itself sends in an hour, across all numbers.
# `max_frequency` above only spaces out sends to one number, so it bounds
# nothing when a caller rotates through many. Our own procedures add a
# per-number count, but the `supabase` strategy reaches GoTrue directly and
# never passes through them.
#
# This is not the control for premium-rate toll fraud. That one is Twilio's
# geographic permissions, which decide the countries the account may text.
[auth.rate_limit]
sms_sent = 30

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[analytics]
enabled = false

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"
