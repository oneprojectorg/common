<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Common Process Setup</title>
    <!--
      The same two faces the product loads through next/font, from the host the
      Artifact CSP allows. Roboto is pulled as a variable font so `font-strong`
      (450) renders true instead of rounding up to 500.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Roboto+Serif:ital,wght@0,300;0,400;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* next/font puts these on the body element, not :root — match that so
         the token fallbacks in @op/styles resolve as they do in the product.
         (No literal tag names in here: the build splits this file on them.) */
      body {
        --font-sans: 'Roboto', ui-sans-serif, system-ui, sans-serif;
        --font-serif: 'Roboto Serif', ui-serif, Georgia, Cambria, serif;
      }
    </style>
  </head>
  <body class="h-full overflow-x-hidden bg-background text-base text-foreground antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
