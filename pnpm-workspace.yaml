packages:
  - 'apps/*'
  - 'configs/*'
  - 'packages/*'
  - 'assets/*'
  - 'services/*'
  - 'backend/*'
  - 'tools/*'
  - 'tests/*'
catalog:
  next: 16.4.6
  zod: ^4.6.7
  access-zones: 1.1.0
  drizzle-orm: 1.0.0-beta.11-05230d9
  drizzle-zod: 1.0.0-beta.11-05230d9
  '@supabase/ssr': 0.5.2
  '@supabase/supabase-js': 2.49.3
  supabase: 3.2.0
  vitest: ^4.1.11
  # The coverage provider's peerDeps demand an exact vitest match, so the two
  # move in lockstep. Bump both together.
  '@vitest/coverage-istanbul': ^4.1.11
  '@tiptap/core': ^3.15.3
  '@tiptap/pm': ^3.15.3
  '@tiptap/react': ^3.15.3
  '@tiptap/starter-kit': ^3.15.3
  # Pinned exact to match the resolved tiptap suite (3.17.1): static-renderer's
  # peerDeps demand an exact core/pm match, and a caret floats it to a newer
  # major-minor that skews against the suite. Bump in lockstep with the suite.
  '@tiptap/static-renderer': 3.17.1
  '@tiptap/extension-blockquote': ^3.15.3
  '@tiptap/extension-bubble-menu': ^3.15.3
  '@tiptap/extension-bullet-list': ^3.15.3
  '@tiptap/extension-collaboration': ^3.15.3
  '@tiptap/extension-collaboration-caret': ^3.15.3
  '@tiptap/extension-details': 3.17.1
  '@tiptap/extension-document': ^3.15.3
  '@tiptap/extension-heading': ^3.15.3
  '@tiptap/html': ^3.15.3
  '@tiptap/extension-horizontal-rule': ^3.15.3
  '@tiptap/extension-image': ^3.15.3
  '@tiptap/extension-link': ^3.15.3
  '@tiptap/extension-list-item': ^3.15.3
  '@tiptap/extension-ordered-list': ^3.15.3
  '@tiptap/extension-paragraph': ^3.15.3
  '@tiptap/extension-placeholder': ^3.15.3
  '@tiptap/extension-strike': ^3.15.3
  '@tiptap/extension-text': ^3.15.3
  '@tiptap/extension-text-align': ^3.15.3
  '@tiptap/extension-underline': ^3.15.3
  '@tiptap/suggestion': ^3.15.3
overrides:
  '@opentelemetry/sdk-metrics': ^2.2.0
  '@react-three/drei': $@react-three/drei
  '@react-three/fiber': $@react-three/fiber
  '@supabase/ssr': $@supabase/ssr
  '@supabase/supabase-js': $@supabase/supabase-js
  '@tanstack/query-sync-storage-persister': $@tanstack/query-sync-storage-persister
  '@tanstack/react-query': $@tanstack/react-query
  '@tanstack/react-query-persist-client': $@tanstack/react-query-persist-client
  '@trpc/client': $@trpc/client
  '@trpc/next': $@trpc/next
  '@trpc/react-query': $@trpc/react-query
  '@trpc/server': $@trpc/server
  '@types/d3-scale': $@types/d3-scale
  '@types/d3-selection': $@types/d3-selection
  '@types/pg': 8.11.11
  '@types/react': $@types/react
  '@types/react-dom': $@types/react-dom
  '@types/three': $@types/three
  '@xyflow/react': $@xyflow/react
  concurrently: $concurrently
  cookie: $cookie
  cross-env: $cross-env
  d3-scale: $d3-scale
  d3-selection: $d3-selection
  dotenv: $dotenv
  js-yaml: $js-yaml
  motion: $motion
  nanoid@<3.3.18: 3.3.18
  postcss: $postcss
  postgres: $postgres
  react: $react
  react-dom: $react-dom
  react-markdown: $react-markdown
  react-resizable-panels: $react-resizable-panels
  server-only: $server-only
  sonner: $sonner
  supabase: $supabase
  superjson: $superjson
  three: $three
  tsx: $tsx
  turbo: $turbo
  typescript: $typescript
  undici: 5.27.1
  use-error-boundary: $use-error-boundary
  zustand: $zustand
allowBuilds:
  '@parcel/watcher': true
  '@posthog/cli': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  core-js: true
  esbuild: true
  inngest-cli: true
  protobufjs: true
  sharp: true
