name: PR metrics

# Measures the review metrics the `pr-description` skill asks for — blast
# radius and CRAP — on every push to a PR, and rewrites one line at the end of
# the PR body with the result. The full reports go to the job summary, linked
# from that line. Nothing here is a required check: the numbers are for the
# reviewer, and a failure to measure reads "unavailable" in the body rather
# than blocking the merge.
#
# Two jobs, on purpose. `measure` checks out and runs the PR's code, so it gets
# a read-only token. `publish` holds the token that can edit the PR, so it runs
# no PR code: it checks out the splice script from the base branch and treats
# the measured line strictly as data.

on:
  pull_request_target:

permissions:
  contents: read

# One run per PR at a time; a new push supersedes the one in flight.
concurrency:
  group: pr-metrics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FALLOW_VERSION: 3.27.0
  # common-agent-toolkit commit the blast-radius script is taken from. Bump it
  # when the toolkit's `blast-radius` skill changes.
  BLAST_RADIUS_REF: f50427925d886453e9ccad75b7445d26d2af0378

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Fork PRs route through the `fork-ci` environment so a maintainer must
    # approve before `secrets.TIPTAP_PRO_TOKEN` is materialised on the runner.
    environment: ${{ github.event.pull_request.head.repo.fork == true && 'fork-ci' || '' }}

    outputs:
      line: ${{ steps.compose.outputs.line }}

    env:
      BASE_REF: origin/${{ github.event.pull_request.base.ref }}
      # Supabase test instance environment variables (using local dev keys)
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_URL: http://127.0.0.1:55321
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      SUPABASE_SERVICE_ROLE: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
      NEXT_PUBLIC_POSTHOG_KEY: test_posthog_key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Both scripts diff against the merge base with the PR's base branch,
          # so the base branch history has to be here too.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate

      # Runner config, not the checked-out .npmrc: this job checks out the PR's
      # head, so that file is PR-authored and must not be handed the token.
      - name: Authenticate to the Tiptap Pro registry
        env:
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: |
          pnpm config set "@tiptap-pro:registry" "https://registry.tiptap.dev/"
          pnpm config set "//registry.tiptap.dev/:_authToken" "$TIPTAP_PRO_TOKEN"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install fallow
        run: npm install --global "fallow@$FALLOW_VERSION"

      - name: Fetch the blast-radius script
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/oneprojectorg/common-agent-toolkit/$BLAST_RADIUS_REF/plugins/devtools/skills/blast-radius/scripts/blast-radius.ts" \
            --output "$RUNNER_TEMP/blast-radius.ts"

      # Two passes: the markdown section for the job summary and the JSON the
      # body line is built from. Around ten seconds each on a normal PR.
      - name: Measure the blast radius
        continue-on-error: true
        run: |
          node --no-warnings "$RUNNER_TEMP/blast-radius.ts" --base "$BASE_REF" --quiet > "$RUNNER_TEMP/blast.md"
          node --no-warnings "$RUNNER_TEMP/blast-radius.ts" --base "$BASE_REF" --quiet --json > "$RUNNER_TEMP/blast.json"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.95.4

      - name: Use CI config
        run: cp supabase/supabase-ci.toml supabase/config.toml

      - name: Start Supabase
        run: supabase start

      - name: Run migrations
        run: pnpm w:db migrate:test

      # The same suite `tests.yml` gates on, instrumented. A failing test is
      # that workflow's finding, not this one's; here it only means the
      # coverage report is partial, and `pnpm health` reads whatever it wrote.
      - name: Run the tests with coverage
        continue-on-error: true
        run: pnpm test:coverage

      - name: Score CRAP on the changed files
        continue-on-error: true
        run: node scripts/fallow-health.mjs --json --base "$BASE_REF" > "$RUNNER_TEMP/crap.json"

      # Runs even when Supabase or the install broke above: the line then reads
      # "unavailable" for what could not be measured, which is still an answer.
      - name: Compose the PR line and the job summary
        id: compose
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          line=$(node scripts/pr-metrics.mjs \
            --blast "$RUNNER_TEMP/blast.json" \
            --blast-md "$RUNNER_TEMP/blast.md" \
            --crap "$RUNNER_TEMP/crap.json" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --sha "$HEAD_SHA" \
            --summary "$GITHUB_STEP_SUMMARY")
          echo "$line"
          echo "line=$line" >> "$GITHUB_OUTPUT"

  publish:
    name: Update the PR description
    needs: measure
    if: always() && needs.measure.outputs.line != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # Job outputs are strings the `measure` job produced while running PR
      # code. Passed through the environment, never interpolated into a script.
      METRICS_LINE: ${{ needs.measure.outputs.line }}

    steps:
      # The splice script comes from the base branch, which is the code the
      # repository already trusts — not from the PR under measurement.
      - name: Checkout the splice script from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Rewrite the metrics line in the PR body
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          printf '%s\n' "$METRICS_LINE" > "$RUNNER_TEMP/line.md"
          node scripts/pr-metrics-body.mjs "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/line.md" > "$RUNNER_TEMP/next.md"
          if cmp --silent "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/next.md"; then
            echo "Body already carries this line."
            exit 0
          fi
          jq --null-input --rawfile body "$RUNNER_TEMP/next.md" '{body: $body}' \
            | gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --input - --silent
