name: PR metrics

# Publishes the review metrics the `pr-description` skill asks for — blast
# radius and CRAP — to three surfaces under trial: one line at the end of the
# PR body, a sticky comment carrying the CRAP table and the blast-radius
# section, and a check run.
# Nothing here is a required check: the numbers are for the reviewer, and a
# failure to measure reads "unavailable" rather than blocking the merge.
#
# This workflow no longer measures anything. `tests.yml` already installs the
# monorepo, starts the test Supabase and runs the suite; instrumenting that one
# run costs about twenty seconds, and scoring the two metrics against the
# coverage report it leaves behind costs a second or two more. Repeating all of
# that here cost six to eight minutes for the same numbers, so the measurement
# moved into `tests.yml` and this file kept only the two jobs that hold the
# token that can write to the PR.
#
# Two triggers, on purpose:
#
#   pull_request_target  `announce` — the "measuring…" placeholder, posted as
#                        soon as the push lands so the reader knows a result is
#                        coming.
#   workflow_run         `publish` — runs once the Tests run it belongs to has
#                        finished, and downloads that run's `pr-metrics`
#                        artifact. A `workflow_run` job checks out this
#                        repository's default branch and never the PR's head, so
#                        the measured text stays strictly data.
#
# `workflow_run` is only ever read from the default branch, so a change to this
# file takes effect on the PRs that come after it merges, not on its own.

on:
  pull_request_target:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  contents: read

# One run per PR at a time; a new push supersedes the one in flight. The two
# triggers key on different things — a PR number and a commit — so they never
# cancel each other, and a superseded measurement is caught by the head-SHA
# check in `publish` instead.
concurrency:
  group: pr-metrics-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  # Posts the "measuring…" comment and opens an in-progress check run before the
  # Tests run gets to the measurement, so the reader knows a result is coming.
  announce:
    name: Announce
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout the publishing script from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts

      - name: Post the placeholder comment and open the check run
        run: node scripts/pr-metrics-publish.mjs announce

  publish:
    name: Publish
    # `completed` also covers a cancelled Tests run — usually one superseded by
    # a newer push, whose own run will publish. Nothing to say about that one.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
      checks: write

    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      # The Tests run holds the job summary with the full report, so that is
      # what "full report" should point the reader at.
      RUN_URL: ${{ github.event.workflow_run.html_url }}

    steps:
      - name: Checkout the publishing script from the default branch
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Download the report and the comment
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pr-metrics
          path: ${{ runner.temp }}/in
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # `pr.txt` comes out of a job that ran the PR's own code, so the number in
      # it is a claim, not a fact: it is reduced to digits and then checked
      # against the API. A PR whose head has moved on is skipped outright —
      # its newer Tests run publishes the numbers that match.
      - name: Resolve and verify the pull request
        id: pr
        env:
          PR_FILE: ${{ runner.temp }}/in/pr.txt
        run: |
          set -uo pipefail
          claimed=$( (tr -cd '0-9' < "$PR_FILE" | head -c 9) 2>/dev/null || true)
          if [ -z "$claimed" ]; then
            # No artifact: the measurement never got that far. Fall back to the
            # PRs GitHub itself associates with the commit, so the failure note
            # still reaches the right thread.
            claimed=$(gh api "/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq 'map(select(.state == "open")) | first | .number // empty' || true)
          fi
          if [ -z "$claimed" ]; then
            echo "No pull request for $HEAD_SHA; nothing to publish."
            exit 0
          fi
          actual=$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$claimed" --jq .head.sha || true)
          if [ "$actual" != "$HEAD_SHA" ]; then
            echo "PR #$claimed is at '$actual', not $HEAD_SHA — superseded, skipping."
            exit 0
          fi
          echo "number=$claimed" >> "$GITHUB_OUTPUT"

      # `runner` is a step-level context; naming it in the job's `env` makes
      # GitHub reject the whole workflow file before any job starts.
      - name: Rewrite the body line, the comment and the check run
        if: steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          LINE_FILE: ${{ runner.temp }}/in/line.txt
          COMMENT_FILE: ${{ runner.temp }}/in/comment.md
          REPORT_FILE: ${{ runner.temp }}/in/report.md
        run: node scripts/pr-metrics-publish.mjs publish
