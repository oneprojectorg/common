name: Checks

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: blacksmith-2vcpu-ubuntu-2204
    # Fork PRs route through the `fork-ci` environment so a maintainer must
    # approve before `secrets.TIPTAP_PRO_TOKEN` is materialised on the runner.
    # Internal PRs (and pushes) evaluate to an empty string and skip the gate.
    environment: ${{ github.event.pull_request.head.repo.fork == true && 'fork-ci' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate

      # Runner config, not the checked-out .npmrc: these jobs check out the PR's
      # head, so that file is PR-authored and must not be handed the token.
      - name: Authenticate to the Tiptap Pro registry
        env:
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: |
          pnpm config set "@tiptap-pro:registry" "https://registry.tiptap.dev/"
          pnpm config set "//registry.tiptap.dev/:_authToken" "$TIPTAP_PRO_TOKEN"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # An English copy change must reach every translation. Diffed against
      # the PR's base branch, which `fetch-depth: 0` leaves under `origin/`.
      - name: Check translations follow English copy changes
        env:
          I18N_BASE: origin/${{ github.base_ref }}
        run: pnpm i18n:check "$I18N_BASE"

      - name: Run TypeScript checks - App
        run: pnpm typecheck

  # A merged ADR is numbered by .github/workflows/adr-numbering.yml, so a PR
  # may only add docs/adr/draft-*.md; one numbered by hand would collide with
  # whatever lands on dev first. The script is taken from the base branch, not
  # the PR head, and the token is not persisted, so PR-authored code runs
  # without credentials and needs no fork gate.
  adr-numbers:
    name: ADR numbers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check no ADR is numbered by hand
        env:
          BASE: origin/${{ github.base_ref }}
        run: git show "$BASE:scripts/number-adrs.sh" | bash -s -- --check "$BASE"

  design-system:
    name: Design system
    runs-on: blacksmith-2vcpu-ubuntu-2204
    # Fork PRs route through the `fork-ci` environment so a maintainer must
    # approve before `secrets.TIPTAP_PRO_TOKEN` is materialised on the runner.
    # Internal PRs (and pushes) evaluate to an empty string and skip the gate.
    environment: ${{ github.event.pull_request.head.repo.fork == true && 'fork-ci' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate

      # Runner config, not the checked-out .npmrc: these jobs check out the PR's
      # head, so that file is PR-authored and must not be handed the token.
      - name: Authenticate to the Tiptap Pro registry
        env:
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: |
          pnpm config set "@tiptap-pro:registry" "https://registry.tiptap.dev/"
          pnpm config set "//registry.tiptap.dev/:_authToken" "$TIPTAP_PRO_TOKEN"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every story has to compile and bundle. Kept off the Supabase-backed
      # Tests job so a design-system regression reports on its own and doesn't
      # wait on a database. The axe gate joins this job once the
      # addon-vitest/aria-query break upstream is resolved.
      #
      # Driven through turbo, not `pnpm w:sense build`: @op/styles resolves to
      # a generated ./dist/styles.css, so the storybook build needs turbo's
      # `^build` to compile it first. Calling storybook directly works locally
      # only because dist/ is already lying around from an earlier build.
      # The `test -s` is load-bearing: turbo exits 0 for a package with no
      # `build` script, so without it a renamed script would leave this job
      # permanently green while compiling nothing.
      - name: Build Storybook
        run: |
          pnpm exec turbo build --filter=@op/sense
          test -s packages/sense/storybook-static/index.html
