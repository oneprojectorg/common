name: Tests

# Gates the PR on the vitest suites, and measures the PR metrics off the same
# instrumented run. `pr-metrics.yml` publishes the artifact this job uploads.
#
# Pushes to dev run it too, only to save every file's CRAP score under the
# commit's SHA: a PR's CRAP change is measured against dev, and dev's coverage
# needs its own instrumented run.

on:
  pull_request_target:
  push:
    branches: [dev]

permissions:
  contents: read

# Dev runs exist only to save the scores PRs compare against, one at a time: a
# run in progress finishes, since its commit is some PR's merge base, and a
# burst queued behind it collapses to the newest push. PR runs keep a group of
# their own and are never held up from here.
concurrency:
  group: ${{ github.event_name == 'push' && 'tests-dev-crap-scores' || format('tests-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    # Every observed `socket hang up` fetching the Supabase CLI has been on the
    # 2vcpu pool, across two different CLI versions, while the 4vcpu jobs
    # pulling the same archive succeeded in the same runs. The pool is the only
    # variable that tracks, so this job joins the one that is not failing.
    runs-on: blacksmith-4vcpu-ubuntu-2204
    # Fork PRs route through the `fork-ci` environment so a maintainer must
    # approve before `secrets.TIPTAP_PRO_TOKEN` is materialised on the runner.
    # Internal PRs (and pushes) evaluate to an empty string and skip the gate.
    environment: ${{ github.event.pull_request.head.repo.fork == true && 'fork-ci' || '' }}

    env:
      BASE_REF: origin/${{ github.event.pull_request.base.ref }}
      # Supabase test instance environment variables (using local dev keys)
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_URL: http://127.0.0.1:55321
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      SUPABASE_SERVICE_ROLE: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
      NEXT_PUBLIC_POSTHOG_KEY: test_posthog_key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate

      # Runner config, not the checked-out .npmrc: these jobs check out the PR's
      # head, so that file is PR-authored and must not be handed the token.
      - name: Authenticate to the Tiptap Pro registry
        env:
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: |
          pnpm config set "@tiptap-pro:registry" "https://registry.tiptap.dev/"
          pnpm config set "//registry.tiptap.dev/:_authToken" "$TIPTAP_PRO_TOKEN"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.95.4

      - name: Use CI config
        run: cp supabase/supabase-ci.toml supabase/config.toml

      - name: Start Supabase
        run: |
          echo "Starting Supabase with CI config..."
          supabase start
          echo "Supabase started successfully"

      - name: Check Supabase status
        run: supabase status

      - name: Wait for Supabase to be ready and run migrations
        run: pnpm w:db migrate:test

      - name: Run tests with coverage
        id: tests
        run: pnpm test:coverage

      - name: Record every file's CRAP score for PRs to diff against
        if: github.event_name == 'push'
        id: record
        continue-on-error: true
        run: pnpm --silent health --json --write-scores "$RUNNER_TEMP/crap-scores.json" > /dev/null

      - name: Save the CRAP scores under this commit
        if: steps.record.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/crap-scores.json
          key: crap-scores-${{ github.sha }}

      - name: Measure the blast radius
        if: always() && github.event_name == 'pull_request_target'
        continue-on-error: true
        run: |
          pnpm --silent blast-radius --base "$BASE_REF" --quiet > "$RUNNER_TEMP/blast.md"
          pnpm --silent blast-radius --base "$BASE_REF" --quiet --json > "$RUNNER_TEMP/blast.json"

      - name: Find the merge base
        if: always() && github.event_name == 'pull_request_target'
        id: merge-base
        continue-on-error: true
        run: echo "sha=$(git merge-base HEAD "$BASE_REF")" >> "$GITHUB_OUTPUT"

      # Prefers the scores saved on the merge base itself, else the newest dev
      # set; `pnpm health` uses that one only if nothing between the two
      # commits could move coverage, and only if its commit is on dev. Skipped
      # when this run's tests failed: their coverage is incomplete, and a
      # Change column read off it would blame the PR for scores the failure
      # moved.
      - name: Restore dev's CRAP scores
        if: always() && steps.tests.outcome == 'success' && steps.merge-base.outputs.sha != ''
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/crap-scores.json
          key: crap-scores-${{ steps.merge-base.outputs.sha }}
          restore-keys: crap-scores-

      - name: Score CRAP on the changed files
        if: always() && github.event_name == 'pull_request_target'
        continue-on-error: true
        run: |
          pnpm --silent health --json --base "$BASE_REF" \
            --base-scores "$RUNNER_TEMP/crap-scores.json" > "$RUNNER_TEMP/crap.json"

      - name: Compose the line, the comment and the report
        if: always() && github.event_name == 'pull_request_target'
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          # First, so a failed composition is still addressed to the right PR.
          printf '%s\n' "$PR_NUMBER" > "$RUNNER_TEMP/out/pr.txt"
          node scripts/pr-metrics.mjs \
            --blast "$RUNNER_TEMP/blast.json" \
            --blast-md "$RUNNER_TEMP/blast.md" \
            --crap "$RUNNER_TEMP/crap.json" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --sha "$HEAD_SHA" \
            --summary "$RUNNER_TEMP/out/report.md" \
            --comment "$RUNNER_TEMP/out/comment.md" \
            > "$RUNNER_TEMP/out/line.txt"
          cat "$RUNNER_TEMP/out/line.txt"
          echo
          cat "$RUNNER_TEMP/out/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report and the comment
        if: always() && github.event_name == 'pull_request_target'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pr-metrics
          path: ${{ runner.temp }}/out
          retention-days: 7
