name: Number ADRs

# pull_request_target so the token can push to dev for a fork's PR too. Only
# dev is checked out, never the PR's code.

on:
  pull_request_target:
    types:
      - closed
    branches:
      - dev
    paths:
      - 'docs/adr/draft-*.md'

permissions:
  contents: write

concurrency:
  group: adr-numbering
  cancel-in-progress: false

jobs:
  number-adrs:
    name: Number draft ADRs
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Number and push
        run: scripts/number-adrs.sh --push
